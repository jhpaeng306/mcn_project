[project]
name = "mcn-project"
version = "0.1.0"
description = "Pattern emergence under weak forcing unrelated to the pattern: theory and simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0",
    "ipython>=9.15.0",
    "jupyterlab>=4.4",
    "nbconvert>=7.16",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "sympy>=1.14",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
